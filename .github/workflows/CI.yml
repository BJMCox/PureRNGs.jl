name: CI

# GPU and statistical release gates stay outside hosted CI.
on:
  # Automatic runs are disabled. Trigger manually if needed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }} / ${{ matrix.threads }} threads
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    continue-on-error: ${{ matrix.julia == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {julia: '1.10', os: ubuntu-latest, threads: '1'}
          - {julia: '1', os: ubuntu-latest, threads: '4'}
          - {julia: '1', os: macos-latest, threads: '4'}
          - {julia: '1', os: windows-latest, threads: '4'}
          - {julia: 'pre', os: ubuntu-latest, threads: '4'}
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.julia == '1' && matrix.os == 'ubuntu-latest' }}
          annotate: true
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia == '1' && matrix.os == 'ubuntu-latest'
        with:
          directories: src,ext
      - uses: actions/upload-artifact@v7
        if: matrix.julia == '1' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-core
          path: lcov.info
          if-no-files-found: error
      - uses: codecov/codecov-action@v7
        if: matrix.julia == '1' && matrix.os == 'ubuntu-latest'
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true

  downgrade:
    name: Downgrade to compat floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      # Downgrades deps to the declared [compat] floors, so this job tests those floors, not current releases.
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: Random,InteractiveUtils,TOML,Test
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  quality:
    name: Format and Aqua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Format check
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.add(name="JuliaFormatter", version="2.12.6")
            using JuliaFormatter
            format(["src", "ext", "test", "docs", "benchmark"]; verbose=false)'
          git diff --exit-code
      - name: Aqua
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.develop(path=".")
            Pkg.add(name="Aqua", version="0.8.16")
            using Aqua, PureRNGs
            Aqua.test_all(PureRNGs)'

  extensions:
    name: Extension / ${{ matrix.suite }} / CPU
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: distributions, args: ''}
          - {suite: enzyme, args: ''}
          - {suite: reactant, args: 'Philox4x32 Threefry4x64 Threefry4x32 ChaCha'}
          - {suite: measurebase, args: ''}
          - {suite: statsbase, args: ''}
          - {suite: staticarrays, args: ''}
          - {suite: turing, args: ''}
          - {suite: kernelabstractions, args: ''}
    env:
      JULIA_NUM_THREADS: '4'
      PURERNGS_REACTANT_BACKEND: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Test extension with coverage
        run: |
          julia --startup-file=no --check-bounds=yes --code-coverage=user \
            --project=test/environments/${{ matrix.suite }} -e \
            'using Pkg; Pkg.instantiate(; allow_autoprecomp=false); include(popfirst!(ARGS))' \
            test/environments/${{ matrix.suite }}/test/runtests.jl ${{ matrix.args }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.suite }}
          path: lcov.info
          if-no-files-found: error
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
