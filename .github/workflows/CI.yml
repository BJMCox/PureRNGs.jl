name: CI

# Temporary diagnostic branch. Do not merge this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Julia 1.13 / O${{ matrix.optimization }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimization: [2]
    env:
      JULIA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.0'
      - uses: julia-actions/cache@v3
      - name: Instantiate the package
        run: julia --startup-file=no --project -e 'using Pkg; Pkg.instantiate()'
      - name: Diagnose continuation
        continue-on-error: true
        run: julia --startup-file=no --check-bounds=yes -O${{ matrix.optimization }} --project test/windows_continuation_diagnostic.jl
      - name: Disable only SLP vectorization on the same machine
        env:
          JULIA_LLVM_ARGS: '-vectorize-slp=false'
          DIAGNOSTIC_VARIANT: no-slp
        run: julia --startup-file=no --check-bounds=yes -O2 --project test/windows_continuation_diagnostic.jl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-continuation-O${{ matrix.optimization }}
          path: diagnostics/
          if-no-files-found: warn
