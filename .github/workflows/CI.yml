name: CI

# Temporary diagnostic branch. Do not merge this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiply:
    name: CPU multiply / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.0'
      - uses: julia-actions/cache@v3
      - name: Instantiate the package
        run: julia --startup-file=no --project -e 'using Pkg; Pkg.instantiate()'
      - name: Measure the exact base without coverage
        env:
          PURERNGS_MULTIPLY_BENCHMARK: baseline
        run: julia --startup-file=no --project -e 'using Pkg; Pkg.test(; julia_args=["-O2"])'
      - name: Check and measure shared portable arithmetic
        env:
          PURERNGS_MULTIPLY_BENCHMARK: portable
        run: julia --startup-file=no --project -e 'using Pkg; Pkg.test(; julia_args=["-O2"])'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpu-multiply-${{ matrix.os }}
          path: diagnostics/
          if-no-files-found: warn
