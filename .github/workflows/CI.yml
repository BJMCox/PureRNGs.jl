name: CI

# GPU and statistical release gates stay outside hosted CI.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }} / ${{ matrix.threads }} threads
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {julia: '1.10', os: ubuntu-latest, threads: '1'}
          - {julia: '1', os: ubuntu-latest, threads: '4'}
          - {julia: '1', os: macos-latest, threads: '4'}
          - {julia: '1', os: windows-latest, threads: '4'}
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.julia == '1' && matrix.os == 'ubuntu-latest' }}
      - name: Test CPU extensions with coverage
        if: matrix.julia == '1' && matrix.os == 'ubuntu-latest'
        run: |
          for suite in distributions enzyme; do
            julia --startup-file=no --check-bounds=yes --code-coverage=user \
              --project="test/environments/$suite" -e \
              'using Pkg; Pkg.instantiate(; allow_autoprecomp=false); include(ARGS[1])' \
              "test/environments/$suite/runtests.jl"
          done
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia == '1' && matrix.os == 'ubuntu-latest'
        with:
          directories: src,ext
      - uses: actions/upload-artifact@v7
        if: matrix.julia == '1' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error
      - uses: codecov/codecov-action@v7
        if: matrix.julia == '1' && matrix.os == 'ubuntu-latest'
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
