name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: actions/cache@v6
        with:
          path: ~/.julia
          key: ci-core-${{ runner.os }}-${{ matrix.julia-version }}-${{ hashFiles('Project.toml') }}
      - name: Resolve and instantiate
        run: julia --project=. -e 'using Pkg; Pkg.resolve(); Pkg.instantiate()'
      - name: Test core
        run: julia --project=. -e 'using Pkg; Pkg.test(; coverage=false)'

  extensions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Distributions
            project: test/environments/distributions
            test: test/environments/distributions/runtests.jl
            threads: 1
            timeout: 45
          - name: Enzyme
            project: test/environments/enzyme
            test: test/environments/enzyme/runtests.jl
            threads: 1
            timeout: 60
          - name: MeasureBase
            project: test/environments/measurebase
            test: test/environments/measurebase/runtests.jl
            threads: 1
            timeout: 30
          - name: Turing
            project: test/environments/turing
            test: test/environments/turing/runtests.jl
            threads: 4
            timeout: 90
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: actions/cache@v6
        with:
          path: ~/.julia
          key: ci-extension-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles(format('{0}/Project.toml', matrix.project)) }}
      - name: Resolve and instantiate
        run: |
          julia --project=${{ matrix.project }} -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.resolve(); Pkg.instantiate()'
      - name: Test extension
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
        run: julia --project=${{ matrix.project }} ${{ matrix.test }}

  reactant:
    name: Reactant CPU
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: actions/cache@v6
        with:
          path: ~/.julia
          key: ci-reactant-${{ runner.os }}-${{ hashFiles('test/environments/reactant/Project.toml') }}
      - name: Resolve and instantiate
        run: |
          julia --project=test/environments/reactant -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.resolve(); Pkg.instantiate()'
      - name: Test Reactant on CPU
        env:
          PURERNGS_REACTANT_BACKEND: cpu
        run: julia --project=test/environments/reactant test/environments/reactant/test/runtests.jl

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: actions/cache@v6
        with:
          path: ~/.julia
          key: ci-docs-${{ runner.os }}-${{ hashFiles('docs/Project.toml', 'docs/make.jl', 'docs/src/**') }}
      - name: Resolve and instantiate
        run: |
          julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.resolve(); Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
