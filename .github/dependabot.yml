version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: julia
    directories:
      - /
      - /docs
      - /benchmark
      - /test/environments/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      julia-packages:
        patterns:
          - '*'
